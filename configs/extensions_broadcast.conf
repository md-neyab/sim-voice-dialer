; ============================================================
; SIM Voice Dialer — broadcast dialplan
; install.sh is block ko markers ke beech /etc/asterisk/extensions.conf
; ke end me jodta hai (dobara chalane par duplicate NAHI hota).
; Recording ki file: /var/lib/asterisk/sounds/message.wav
; (format: 8000 Hz, mono, 16-bit WAV — dashboard khud convert kar deta hai)
; ============================================================

[broadcast]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(message)
 same => n,Hangup()

; --- Test context: dongle aane par pehli test call ke liye ---
; sudo asterisk -rx "channel originate Dongle/dongle0/91XXXXXXXXXX extension s@testcall"
; Tumhare number par call aayegi aur built-in "hello-world" sunega.
[testcall]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
