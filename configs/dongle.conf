; ============================================================
; chan_dongle config — install.sh isko /etc/asterisk/dongle.conf
; me copy karta hai. Sirf audio/data ports badalne hote hain.
;
; PORTS KAISE PEHCHANEIN (sabse zaroori step):
; Dongle lagane ke baad:
;     ls /dev/ttyUSB*
; Aam taur par 3 ports aate hain (ttyUSB0, ttyUSB1, ttyUSB2).
; Pakka tareeka:
;     asterisk -rx "dongle discovery"
; Galat port = modem "Free" nahi dikhega, call nahi lagegi.
; ============================================================

[general]
interval=15              ; har 15 sec me modem ki state check karo

[dongle0]
; Incoming call aaye to kis context me jaye (abhi broadcast hi theek hai)
context=broadcast

; --- YE DO LINE apne modem ke ports se badlo ---
audio=/dev/ttyUSB1       ; voice audio wala port (aam taur par beech wala)
data=/dev/ttyUSB2        ; AT command wala port

; Agar IMEI/IMSI se modem fix karna ho to ye lines kholo aur sahi values bharo:
; imei=35xxxxxxxxxxxxx
; imsi=40xxxxxxxxxxxxx

group=0
rxgain=0
txgain=0
resetdongle=yes
usecallingpres=yes
callingpres=allowed_passed_screen
